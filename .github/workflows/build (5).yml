name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Generate project files
        run: |
          mkdir -p src/main/java/com/example/paybuttons src/main/resources
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'paybuttons'
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          minecraft_version=26.1.2
          loader_version=0.19.3
          fabric_version=0.152.1+26.1.2

          mod_version=1.0.0
          maven_group=com.example
          archives_base_name=paybuttons
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 25
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          EOF
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "paybuttons",
            "version": "${version}",
            "name": "Pay Buttons",
            "description": "Adds payback, 2x and bal buttons to payment messages.",
            "environment": "client",
            "entrypoints": {
              "client": ["com.example.paybuttons.PayButtonsClient"]
            },
            "depends": {
              "fabricloader": ">=0.19.2",
              "minecraft": ">=26.1",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          EOF
          cat > src/main/java/com/example/paybuttons/PayButtonsClient.java <<'EOF'
          package com.example.paybuttons;

          import com.mojang.brigadier.arguments.StringArgumentType;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommands;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.message.v1.ClientReceiveMessageEvents;
          import net.minecraft.ChatFormatting;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.screens.ConfirmScreen;
          import net.minecraft.network.chat.ClickEvent;
          import net.minecraft.network.chat.Component;
          import net.minecraft.network.chat.HoverEvent;
          import net.minecraft.network.chat.MutableComponent;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          import java.lang.reflect.Constructor;
          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.lang.reflect.RecordComponent;
          import java.util.ArrayDeque;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.atomic.AtomicInteger;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class PayButtonsClient implements ClientModInitializer {

              // Matches: ".Jamestus3850 paid you $ 10M" (tolerant of symbols/spaces before the number)
              private static final Pattern PAID = Pattern.compile(
                      "(\\.?\\w{1,16}) paid you\\W*?([\\d,]*\\.?\\d+)\\s*([KMBTkmbt]?)");
              private static final Logger LOGGER = LoggerFactory.getLogger("paybuttons");

              // Delay between the two payments in [2x] (ticks, 20 ticks = 1 second)
              private static final int DELAY_TICKS = 10;

              // Tags added beside a payment line
              private static final String TAG_LOST = " - Lost";
              private static final String TAG_PAYEDBACK = " - Payedback";
              private static final String TAG_WON = " - won";

              private static final AtomicInteger NEXT_ID = new AtomicInteger(1);

              // Original payment lines (without buttons), so the buttons can be removed when a tag is applied.
              // Keeps only the most recent 500.
              private static final Map<Integer, Component> ORIGINALS = new LinkedHashMap<>() {
                  @Override
                  protected boolean removeEldestEntry(Map.Entry<Integer, Component> eldest) {
                      return size() > 500;
                  }
              };

              // Queue of /pay commands still to send (first goes out next tick, rest are spaced out)
              private static final ArrayDeque<String> QUEUE = new ArrayDeque<>();
              private static int queueTicks = 0;

              private static Runnable pendingScreen = null;
              private static boolean announced = false;

              @Override
              public void onInitializeClient() {
                  // ---- Add buttons to payment messages ----
                  ClientReceiveMessageEvents.MODIFY_GAME.register((message, overlay) -> {
                      if (overlay) return message;

                      String raw = message.getString().trim();
                      Matcher m = PAID.matcher(raw);
                      if (!m.find()) {
                          if (raw.contains("paid you")) {
                              LOGGER.info("paid-you message did not match: [{}]", raw);
                              return message.copy().append(
                                      Component.literal(" [PB: seen, no match]").withStyle(ChatFormatting.RED));
                          }
                          return message;
                      }

                      String name = m.group(1);
                      String amount = m.group(2).replace(",", "") + m.group(3).toUpperCase();
                      int id = NEXT_ID.getAndIncrement();
                      ORIGINALS.put(id, message);
                      String tail = " " + name + " " + amount + " " + id;

                      MutableComponent out = message.copy();
                      out.append(Component.literal(" "));
                      out.append(button("[payback]", ChatFormatting.GREEN,
                              "/paybuttons_confirm payback" + tail,
                              "Pay " + name + " " + amount + " (asks to confirm)"));
                      out.append(Component.literal(" "));
                      out.append(button("[2x]", ChatFormatting.GOLD,
                              "/paybuttons_confirm twice" + tail,
                              "Pay " + name + " " + amount + " two times (asks to confirm)"));
                      out.append(Component.literal(" "));
                      out.append(button("[X]", ChatFormatting.RED,
                              "/paybuttons_lost " + id,
                              "Mark this payment as lost"));
                      return out;
                  });

                  // ---- Client commands used by the buttons ----
                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) -> {
                      dispatcher.register(ClientCommands.literal("paybuttons_confirm")
                              .then(ClientCommands.argument("type", StringArgumentType.word())
                                      .then(ClientCommands.argument("name", StringArgumentType.word())
                                              .then(ClientCommands.argument("amount", StringArgumentType.word())
                                                      .then(ClientCommands.argument("id", StringArgumentType.word())
                                                              .executes(ctx -> {
                                                                  String type = StringArgumentType.getString(ctx, "type");
                                                                  String name = StringArgumentType.getString(ctx, "name");
                                                                  String amount = StringArgumentType.getString(ctx, "amount");
                                                                  String id = StringArgumentType.getString(ctx, "id");
                                                                  // Open the GUI on the next tick (a chat click closes screens)
                                                                  pendingScreen = () -> openConfirm(type, name, amount, id);
                                                                  return 1;
                                                              }))))));

                      dispatcher.register(ClientCommands.literal("paybuttons_lost")
                              .then(ClientCommands.argument("id", StringArgumentType.word())
                                      .executes(ctx -> {
                                          tagMessage(StringArgumentType.getString(ctx, "id"), TAG_LOST, ChatFormatting.RED);
                                          return 1;
                                      })));
                  });

                  // ---- Per-tick work ----
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (pendingScreen != null) {
                          Runnable r = pendingScreen;
                          pendingScreen = null;
                          r.run();
                      }

                      if (client.player == null) {
                          announced = false;
                          QUEUE.clear();
                      } else if (!announced) {
                          announced = true;
                          notice("[PayButtons] loaded", ChatFormatting.GREEN);
                      }

                      if (!QUEUE.isEmpty() && --queueTicks <= 0) {
                          String cmd = QUEUE.poll();
                          if (client.getConnection() != null) {
                              client.getConnection().sendCommand(cmd);
                          }
                          queueTicks = DELAY_TICKS;
                      }
                  });
              }

              // ---------- Confirmation GUI ----------

              private static void openConfirm(String type, String name, String amount, String id) {
                  Minecraft mc = Minecraft.getInstance();

                  int times;
                  String label;
                  switch (type) {
                      case "twice" -> { times = 2; label = "two times"; }
                      default -> { times = 1; label = ""; }
                  }

                  Component title = Component.literal(times == 1 ? "Confirm payback" : "Confirm " + times + "x payment");
                  Component text = Component.literal(times == 1
                          ? "Pay " + name + " " + amount + "?"
                          : "Pay " + name + " " + amount + " " + label + "? (total " + times + " x " + amount + ")");

                  mc.setScreen(new ConfirmScreen(yes -> {
                      mc.setScreen(null);
                      if (!yes) return;

                      sendPay(name, amount, times);

                      // Tag the payment line after confirming
                      if (times == 1) {
                          tagMessage(id, TAG_PAYEDBACK, ChatFormatting.GREEN);
                      } else if (times == 2) {
                          tagMessage(id, TAG_WON, ChatFormatting.GOLD);
                      }
                  }, title, text));
              }

              private static void sendPay(String name, String amount, int times) {
                  boolean wasEmpty = QUEUE.isEmpty();
                  String cmd = "pay " + name + " " + amount;
                  for (int i = 0; i < times; i++) {
                      QUEUE.add(cmd);
                  }
                  if (wasEmpty) queueTicks = 0; // first payment goes out on the next tick
              }

              // ---------- Add a tag beside a payment line ----------

              private static void tagMessage(String id, String tag, ChatFormatting color) {
                  Minecraft mc = Minecraft.getInstance();
                  String token = "paybuttons_lost " + id;
                  try {
                      Object chat = mc.gui.getChat();
                      List<Object> all = findAllMessages(chat);
                      if (all == null) {
                          notice("[PayButtons] Could not access chat history", ChatFormatting.RED);
                          return;
                      }

                      for (int i = 0; i < all.size(); i++) {
                          Object gm = all.get(i);
                          Component content = contentOf(gm);
                          if (content == null || !hasCommand(content, token)) continue;

                          String text = content.getString();
                          if (text.endsWith(TAG_LOST) || text.endsWith(TAG_PAYEDBACK) || text.endsWith(TAG_WON)) {
                              return; // already tagged
                          }

                          // Rebuild from the original line so the buttons are removed
                          Component base = null;
                          try {
                              base = ORIGINALS.get(Integer.parseInt(id));
                          } catch (NumberFormatException ignored) {
                              // fall back below
                          }
                          if (base == null) base = content;

                          Component updated = base.copy().append(Component.literal(tag).withStyle(color));
                          all.set(i, withContent(gm, updated));
                          refreshChat(chat);
                          return;
                      }
                      notice("[PayButtons] That payment is no longer in the chat history", ChatFormatting.RED);
                  } catch (Throwable t) {
                      LOGGER.warn("Could not tag payment", t);
                      notice("[PayButtons] Could not mark it (see log)", ChatFormatting.RED);
                  }
              }

              private static boolean hasCommand(Component c, String token) {
                  ClickEvent ev = c.getStyle().getClickEvent();
                  if (ev instanceof ClickEvent.RunCommand rc && rc.command().endsWith(token)) return true;
                  for (Component sibling : c.getSiblings()) {
                      if (hasCommand(sibling, token)) return true;
                  }
                  return false;
              }

              // Reflection keeps this independent of internal field/method names.
              @SuppressWarnings("unchecked")
              private static List<Object> findAllMessages(Object chat) throws Exception {
                  for (Field f : chat.getClass().getDeclaredFields()) {
                      if (!List.class.isAssignableFrom(f.getType())) continue;
                      if (f.getGenericType().getTypeName().endsWith(".GuiMessage>")) {
                          f.setAccessible(true);
                          return (List<Object>) f.get(chat);
                      }
                  }
                  return null;
              }

              private static Component contentOf(Object gm) throws Exception {
                  for (RecordComponent rc : gm.getClass().getRecordComponents()) {
                      if (rc.getType() == Component.class) {
                          Method acc = rc.getAccessor();
                          acc.setAccessible(true);
                          return (Component) acc.invoke(gm);
                      }
                  }
                  return null;
              }

              private static Object withContent(Object gm, Component content) throws Exception {
                  RecordComponent[] rcs = gm.getClass().getRecordComponents();
                  Class<?>[] types = new Class<?>[rcs.length];
                  Object[] args = new Object[rcs.length];
                  for (int i = 0; i < rcs.length; i++) {
                      types[i] = rcs[i].getType();
                      Method acc = rcs[i].getAccessor();
                      acc.setAccessible(true);
                      args[i] = types[i] == Component.class ? content : acc.invoke(gm);
                  }
                  Constructor<?> ctor = gm.getClass().getDeclaredConstructor(types);
                  ctor.setAccessible(true);
                  return ctor.newInstance(args);
              }

              private static void refreshChat(Object chat) throws Exception {
                  for (String name : new String[] {"rescaleChat", "refreshTrimmedMessages"}) {
                      try {
                          Method m = chat.getClass().getDeclaredMethod(name);
                          m.setAccessible(true);
                          m.invoke(chat);
                          return;
                      } catch (NoSuchMethodException ignored) {
                          // try the next name
                      }
                  }
                  LOGGER.warn("No chat refresh method found; change shows after chat is resized");
              }

              // ---------- Helpers ----------

              private static void notice(String text, ChatFormatting color) {
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.player != null) {
                      mc.player.sendSystemMessage(Component.literal(text).withStyle(color));
                  }
              }

              private static Component button(String label, ChatFormatting color, String command, String hover) {
                  return Component.literal(label).withStyle(style -> style
                          .withColor(color)
                          .withBold(true)
                          .withClickEvent(new ClickEvent.RunCommand(command))
                          .withHoverEvent(new HoverEvent.ShowText(Component.literal(hover))));
              }
          }
          EOF

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: paybuttons-jar
          path: build/libs/*.jar
